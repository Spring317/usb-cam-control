<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EOS R8 Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar glass-panel">
            <h1>EOS R8 Control</h1>
            
            <div class="status-panel">
                <div class="status-indicator" id="connection-status"></div>
                <span id="connection-text">Disconnected</span>
                <button id="btn-connect" class="btn btn-primary">Connect</button>
            </div>

            <div class="controls-panel">
                <h2>Settings</h2>
                
                <div class="control-group">
                    <label for="iso">ISO</label>
                    <select id="iso" disabled></select>
                </div>

                <div class="control-group">
                    <label for="aperture">Aperture</label>
                    <select id="aperture" disabled></select>
                </div>

                <div class="control-group">
                    <label for="shutterspeed">Shutter Speed</label>
                    <select id="shutterspeed" disabled></select>
                </div>

                <div class="control-group">
                    <label for="whitebalance">White Balance</label>
                    <select id="whitebalance" disabled></select>
                </div>

                <button id="btn-apply" class="btn btn-secondary" disabled>Apply Settings</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="live-view-container glass-panel">
                <img id="live-view" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Live View">
                <div class="overlay-controls">
                    <button id="btn-capture" class="btn btn-capture" disabled>
                        <span class="icon">📸</span> Capture
                    </button>
                </div>
            </div>

            <div class="gallery glass-panel">
                <h2>Latest Capture</h2>
                <div id="latest-capture-container">
                    <p class="placeholder-text">No image captured yet.</p>
                    <img id="latest-capture" style="display: none;" />
                </div>
            </div>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
